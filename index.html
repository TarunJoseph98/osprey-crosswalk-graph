<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSPREY Crosswalk Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a full-screen rotating star map of the crosswalk, with a title block, filter dock and details panel floating over it. */
:root {
  color-scheme: dark;
  --sky: #0b1020;          /* page ground */
  --sky-2: #121a33;        /* glow behind the centre */
  --panel: rgba(16, 22, 42, 0.86);
  --line: rgba(160, 176, 220, 0.18);
  --ink: #e6eaf6;
  --ink-2: #a3acc6;
  --ink-3: #6f7896;
  --focus: #9fd3ff;
  /* node types */
  --t-class: #ff7a6b;
  --t-control: #f5c451;
  --t-clause: #7cc4ff;
  --t-standard: #b79cff;
  --t-anchor: #5fd3b8;
  /* link evidence */
  --s-verified: #8ff0c0;
  --s-retrieved: #6f95d9;
  --s-memory: #d9a25f;
  --s-design: #9aa3bd;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow: hidden;
}
canvas#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#sky.dragging { cursor: grabbing; }
canvas#sky.pointing { cursor: pointer; }

.float { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

/* title block */
#head { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  padding: 14px 16px 12px; max-width: min(360px, calc(100vw - 32px)); }
#head h1 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: 0.01em; text-wrap: balance; }
#head .ver { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
#head p { margin: 8px 0 0; color: var(--ink-2); font-size: 13px; }
.counts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 500; }

/* filter dock */
#dock { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding: 12px 14px; display: grid; gap: 12px; max-width: min(380px, calc(100vw - 32px)); }
.group h2 { margin: 0 0 6px; font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--ink); font: 500 12px var(--f-body); cursor: pointer; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip .bar { width: 14px; height: 2px; border-radius: 2px; flex: none; }
.chip .bar.dash { background: none !important; border-top: 2px dashed currentColor; height: 0; }
.chip .n { color: var(--ink-3); font-family: var(--f-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { opacity: 0.4; }
.chip:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: 500 12px var(--f-body); padding: 5px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: rgba(159, 211, 255, 0.16); color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; }

/* details panel */
#panel { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 32px));
  display: flex; flex-direction: column; overflow: hidden; }
#panel .top { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
#search { width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); font: 13px var(--f-body); padding: 7px 10px; }
#search::placeholder { color: var(--ink-3); }
#body { overflow-y: auto; padding: 14px; display: grid; gap: 14px; align-content: start; min-height: 0; }
.kind { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
.kind .dot { width: 8px; height: 8px; border-radius: 50%; }
#body h3 { margin: 4px 0 0; font-family: var(--f-display); font-weight: 600; font-size: 19px; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.id { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); overflow-wrap: anywhere; margin-top: 2px; }
.props { color: var(--ink-2); font-size: 12.5px; overflow-wrap: anywhere; }
.src { font-size: 12.5px; }
.src a { color: var(--focus); }
.sect h4 { margin: 0 0 6px; font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.links li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.links button.to { all: unset; cursor: pointer; font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
.links button.to:hover { color: var(--focus); }
.links button.to:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 11.5px; color: var(--ink-2); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font: 500 10.5px var(--f-mono); letter-spacing: 0.03em; border: 1px solid currentColor; }
.note { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.how { color: var(--ink-2); font-size: 13px; display: grid; gap: 8px; }
.how p { margin: 0; }
.how strong { color: var(--ink); font-weight: 600; }
.statgrid { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 12.5px; }
.statgrid .track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.statgrid .track i { display: block; height: 100%; border-radius: 3px; }
.statgrid .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }
.close { all: unset; cursor: pointer; font-size: 12px; color: var(--ink-3); justify-self: start; }
.close:hover { color: var(--ink); }
.close:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#zoom { right: calc(max(16px, env(safe-area-inset-right, 0px)) + min(380px, calc(100vw - 32px)) + 10px);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; padding: 2px; }
#zoom button { all: unset; width: 32px; height: 30px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); font: 500 16px var(--f-mono); border-radius: 7px; }
#zoom button:hover { color: var(--ink); background: rgba(255,255,255,0.06); }
#zoom button:focus-visible { outline: 2px solid var(--focus); }
#tip { position: fixed; pointer-events: none; padding: 5px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line);
  font-size: 12px; max-width: 280px; z-index: 5; }

@media (max-width: 820px) {
  #head { padding: 10px 12px; }
  #head h1 { font-size: 18px; }
  #head p { display: none; }
  #panel { top: auto; height: 42%; width: auto; left: max(16px, env(safe-area-inset-left, 0px)); }
  #dock { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px) + 96px); padding: 10px 12px; gap: 8px; }
  #dock .legend-group { display: none; }
  #zoom { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(42% + 24px + env(safe-area-inset-bottom, 0px)); }
}
</style>
</head>
<body>


<canvas id="sky" aria-label="Interactive map of the OSPREY control crosswalk. Drag to turn it, point at a node to see what it connects to."></canvas>

<header id="head" class="float">
  <h1>OSPREY Crosswalk Graph</h1>
  <div class="ver">Control crosswalk v0.2 · built 8 Nov 2026</div>
  <p>How each threat class OSPREY detects links to the controls that stop it, the clauses those controls satisfy, and the public threat lists that name it.</p>
  <div class="counts" id="counts"></div>
</header>

<section id="dock" class="float" aria-label="Filters">
  <div class="group">
    <h2>Region</h2>
    <div class="seg" role="group" aria-label="Region">
      <button id="r-all" type="button" aria-pressed="true">All regions</button>
      <button id="r-cagl" type="button" aria-pressed="false">Canada + Global</button>
    </div>
  </div>
  <div class="group">
    <h2>Link evidence</h2>
    <div class="row" id="status-chips"></div>
  </div>
  <div class="group legend-group">
    <h2>Node types</h2>
    <div class="legend" id="legend"></div>
  </div>
</section>

<div id="zoom" class="float" aria-label="Zoom">
  <button type="button" id="z-in" aria-label="Zoom in">+</button>
  <button type="button" id="z-out" aria-label="Zoom out">−</button>
  <button type="button" id="z-spin" aria-label="Pause or resume turning" title="Pause or resume turning">⏸</button>
</div>

<aside id="panel" class="float" aria-label="Details">
  <div class="top">
    <input id="search" type="search" list="nodelist" placeholder="Find a class, control, clause or standard" autocomplete="off">
    <datalist id="nodelist"></datalist>
  </div>
  <div id="body" aria-live="polite"></div>
</aside>
<div id="tip" hidden></div>

  }
}

function frame() {
  if (state.spin && !drag.active) state.rotY += 0.0016;
  draw();
  requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
const drag = { active: false, moved: false, x: 0, y: 0, pts: new Map(), pinch: 0 };
function hit(x, y) {
  let best = null, bd = Infinity;
  for (const n of visibleNodes) {
    const d = Math.hypot(n.sx - x, n.sy - y);
    if (d < Math.max(10, n.r + 5) && d < bd) { bd = d; best = n; }
  }
  return best;
}
const tip = document.getElementById("tip");
cv.addEventListener("pointerdown", ev => {
  cv.setPointerCapture(ev.pointerId);
  drag.pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  drag.active = true; drag.moved = false; drag.x = ev.clientX; drag.y = ev.clientY;
  if (drag.pts.size === 2) { const [p, q] = [...drag.pts.values()]; drag.pinch = Math.hypot(p.x - q.x, p.y - q.y); }
});
cv.addEventListener("pointermove", ev => {
  if (drag.active && drag.pts.has(ev.pointerId)) {
    drag.pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (drag.pts.size === 2) {
      const [p, q] = [...drag.pts.values()], d = Math.hypot(p.x - q.x, p.y - q.y);
      if (drag.pinch) setZoom(state.zoom * d / drag.pinch);
      drag.pinch = d; drag.moved = true; return;
    }
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; cv.classList.add("dragging"); }
    if (drag.moved) {
      state.rotY += dx * 0.006;
      state.rotX = Math.max(-1.3, Math.min(1.3, state.rotX + dy * 0.004));
      drag.x = ev.clientX; drag.y = ev.clientY;
    }
    return;
  }
  const n = hit(ev.clientX, ev.clientY);
  state.hover = n;
  cv.classList.toggle("pointing", !!n);
  if (n) {
    tip.hidden = false;
    tip.textContent = `${TYPES[n.type].name}: ${n.label}`;
    tip.style.left = Math.min(ev.clientX + 14, W - 290) + "px"; tip.style.top = (ev.clientY + 14) + "px";
  } else tip.hidden = true;
});
function endPointer(ev) {
  drag.pts.delete(ev.pointerId);
  if (drag.pts.size > 0) return;
  cv.classList.remove("dragging");
  if (!drag.moved) select(hit(ev.clientX, ev.clientY));
  drag.active = false; drag.pinch = 0;
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", ev => { drag.pts.delete(ev.pointerId); drag.active = drag.pts.size > 0; cv.classList.remove("dragging"); });
cv.addEventListener("pointerleave", () => { state.hover = null; tip.hidden = true; });
cv.addEventListener("wheel", ev => { ev.preventDefault(); setZoom(state.zoom * Math.exp(-ev.deltaY * 0.0012)); }, { passive: false });
function setZoom(z) { state.zoom = Math.max(0.45, Math.min(4, z)); }
document.getElementById("z-in").onclick = () => setZoom(state.zoom * 1.25);
document.getElementById("z-out").onclick = () => setZoom(state.zoom / 1.25);
const spinBtn = document.getElementById("z-spin");
function syncSpin() { spinBtn.textContent = state.spin ? "⏸" : "▶"; }
spinBtn.onclick = () => { state.spin = !state.spin; syncSpin(); };
syncSpin();

function select(n) {
  state.selected = n || null;
  renderPanel();
}

/* ---------- panel ---------- */
const $body = document.getElementById("body");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function pill(status) { return `<span class="pill" style="color:${COLORS[status]}" title="${esc(STATUS[status].help)}">${STATUS[status].name}</span>`; }
function kind(type) { return `<span class="kind" style="color:${COLORS[type]}"><span class="dot" style="background:${COLORS[type]}"></span>${TYPES[type].name}</span>`; }

function renderPanel() {
  const n = state.selected;
  if (!n) { $body.innerHTML = overview(); return; }
  const groups = {};
  for (const e of visibleEdges) {
    if (e.a !== n && e.b !== n) continue;
    const out = e.a === n, other = out ? e.b : e.a, title = RELATION[e.type][out ? 0 : 1];
    (groups[title] ||= []).push({ e, other });
  }
  const order = { VERIFIED: 0, RETRIEVED: 1, INTERNAL_DESIGN: 2, FROM_KNOWLEDGE: 3 };
  let html = `<div>${kind(n.type)}<h3>${esc(n.label)}</h3><div class="id">${esc(n.id)}${n.region ? " · " + esc(REGION[n.region] || n.region) : ""}</div></div>`;
  if (n.props) html += `<div class="props">${esc(n.props.replace(/; /g, " · ").replace(/=/g, ": "))}</div>`;
  const doc = n.type === "Standard" ? n : n.type === "Requirement" ? byId[standardOf[n.id]] : null;
  if (doc && doc.url) html += `<div class="src">Where to read it: <a href="${esc(doc.url)}" target="_blank" rel="noopener">${esc(doc.label)}</a>${doc.licensed ? " (licensed; no public text)" : ""}</div>`;
  for (const [title, items] of Object.entries(groups)) {
    items.sort((p, q) => order[p.e.status] - order[q.e.status] || p.other.label.localeCompare(q.other.label));
    html += `<div class="sect"><h4>${esc(title)} · ${items.length}</h4><ul class="links">`;
    for (const { e, other } of items) {
      const bits = [pill(e.status)];
      if (e.strength) bits.push(`strength: ${esc(e.strength)}`);
      if (e.region) bits.push(esc(REGION[e.region] || e.region));
      if (e.clause && e.type !== "PART_OF") bits.push(`<span class="id">${esc(e.clause)}</span>`);
      html += `<li><button class="to" type="button" data-id="${esc(other.id)}">${esc(other.label)}</button><div class="meta">${bits.join("")}</div>${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}</li>`;
    }
    html += `</ul></div>`;
  }
  if (!Object.keys(groups).length) html += `<div class="how"><p>No links shown with the current filters.</p></div>`;
  html += `<button class="close" type="button" id="clear">Back to the overview</button>`;
  $body.innerHTML = html;
  $body.scrollTop = 0;
}
$body.addEventListener("click", ev => {
  const b = ev.target.closest("button.to");
  if (b) { select(byId[b.dataset.id]); return; }
  if (ev.target.id === "clear") select(null);
  const c = ev.target.closest("button[data-pick]");
  if (c) select(byId[c.dataset.pick]);
});

function overview() {
  const counts = {}; for (const e of visibleEdges) counts[e.status] = (counts[e.status] || 0) + 1;
  const total = visibleEdges.length || 1;
  let rows = "";
  for (const [k, s] of Object.entries(STATUS)) {
    const v = counts[k] || 0;
    rows += `<span>${pill(k)}</span><span class="track"><i style="width:${(v / total * 100).toFixed(1)}%;background:${COLORS[k]}"></i></span><span class="v">${v}</span>`;
  }
  const classes = nodes.filter(n => n.type === "ThreatClass").map(n => `<button class="chip" type="button" data-pick="${esc(n.id)}"><span class="dot" style="background:${COLORS.ThreatClass}"></span>${esc(n.label)}</button>`).join("");
  return `<div class="how">
      <p><strong>Read it from the centre out.</strong> The four threat classes sit in the middle. Around them are the controls that stop them, then the public threat lists that name them, then the clauses each control satisfies, and on the outside the regulations and standards those clauses come from.</p>
      <p><strong>Each link's colour shows how far it was checked.</strong> Bright green links were checked against the source document by an independent reviewer. The rest are labelled by where they came from.</p>
      <p>Drag to turn the map. Point at a node to see what it connects to, and click it for the details and where to read the source.</p>
    </div>
    <div class="sect"><h4>Links shown, by evidence</h4><div class="statgrid">${rows}</div></div>
    <div class="sect"><h4>Start with a threat class</h4><div class="row">${classes}</div></div>
    <div class="how"><p>The pipeline uses the Canada and Global links only. The US, UK and EU links are drafted but not checked.</p></div>`;
}

function renderCounts() {
  const v = visibleEdges.filter(e => e.status === "VERIFIED").length;
  document.getElementById("counts").innerHTML =
    `<span><b>${visibleNodes.size}</b> nodes</span><span><b>${visibleEdges.length}</b> links</span><span><b style="color:${COLORS.VERIFIED}">${v}</b> verified</span>`;
}

/* ---------- controls ---------- */
const chipsEl = document.getElementById("status-chips");
for (const [k, s] of Object.entries(STATUS)) {
  const n = edges.filter(e => e.status === k).length;
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.setAttribute("aria-pressed", "true"); b.title = s.help;
  b.innerHTML = `<span class="bar${k === "FROM_KNOWLEDGE" ? " dash" : ""}" style="background:${COLORS[k]};color:${COLORS[k]}"></span>${s.name}<span class="n">${n}</span>`;
  b.onclick = () => { state.status[k] = !state.status[k]; b.setAttribute("aria-pressed", String(state.status[k])); refilter(); };
  chipsEl.appendChild(b);
}
const legend = document.getElementById("legend");
for (const [k, t] of Object.entries(TYPES)) {
  const n = nodes.filter(x => x.type === k).length;
  legend.insertAdjacentHTML("beforeend", `<span><span class="dot" style="background:${COLORS[k]}"></span>${t.name} <span class="n" style="color:var(--ink-3);font-family:var(--f-mono);font-size:11px">${n}</span></span>`);
}
const rAll = document.getElementById("r-all"), rCa = document.getElementById("r-cagl");
function setRegion(r) { state.region = r; rAll.setAttribute("aria-pressed", String(r === "all")); rCa.setAttribute("aria-pressed", String(r === "cagl")); refilter(); }
rAll.onclick = () => setRegion("all"); rCa.onclick = () => setRegion("cagl");

const list = document.getElementById("nodelist");
const byLabel = {};
for (const n of [...nodes].sort((a, b) => a.label.localeCompare(b.label))) {
  const key = `${n.label} (${TYPES[n.type].name})`; byLabel[key] = n;
  const o = document.createElement("option"); o.value = key; list.appendChild(o);
}
const search = document.getElementById("search");
search.addEventListener("change", () => {
  const q = search.value.trim().toLowerCase();
  const n = byLabel[search.value] || nodes.find(x => x.label.toLowerCase().includes(q) || x.id.toLowerCase().includes(q));
  if (n) { if (!visibleNodes.has(n)) { setRegion("all"); for (const k in state.status) state.status[k] = true; chipsEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "true")); refilter(); } select(n); }
});

window.addEventListener("resize", resize);
resize(); refilter(); requestAnimationFrame(frame);
</script>

</body>
</html>
